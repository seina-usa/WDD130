<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks</title>
    <style>
        /* Insert styles here, this is called an internal stylesheet  */
        body {
            background: #FFECD7;
        }
        .card {
            background-color: #008db1;
            border-color: #004e63;
            text-align: center;
            max-width: 390px;
            min-width: 280px;
            width: 100%;
            height: auto;
            margin: 24px auto;
            padding: 28px 24px;
            overflow: hidden;
            box-sizing: border-box;
            text-align: center;
            border-radius: 30px;
            border: 4px solid #004e63;
            
        }
        .card h1 {
            color: #fffffe;
            font-family: Helvetica, sans-serif;
            font-size: 36px;
            margin: 0 0 4px 0;
        }
        .card h3 {
            display: block;
            color: #91e4fb;
            font-family: Helvetica;
            font-size: 18px;
            line-height: 1.3;
            margin: 0 0 14px 0;
        }
        .card h2 {
            color: #FFFFFE;
            font-family: Helvetica, sans-serif;
            font-size: 20px;
            margin-bottom: 15px;
            padding-left: 24px;
            text-align: left;
        }
        .card blockquote {
            color: #ffd783;
            font-family: "Brush Script MT", "Nanum Brush Script", cursive;
            font-size: 20px;
            margin: 32px 0 0 0;
            font-style: italic;
        }
        .card img {
            display: block;
            max-width: 240px;
            width: 100%;
            height: auto;
            align-items: center;
            border: 5px solid #FFFFFE;
            border-radius: 0px;
            margin: 0 auto 8px auto;
        }

    </style>
</head>
<body>
    <main class="card">
        <h1>Dallin H.Oaks</h1>
        <h3>18th President of the Church of Jesus Christ of Latter-day Saints</h3>
        <img src="images/oaks.webp" alt="Dellin H.Oaks">
        <h2>・Born: Aug 12, 1932<br>・Apostle: Apr 7, 1984<br>・Prophet: Oct 14,2025</h2>
        <blockquote>"The only permanent solution to the differences that divide us is for all of us to follow our Savior's teachings and to gradually become even as He is."</blockquote>
    </main>
</body>
</html>

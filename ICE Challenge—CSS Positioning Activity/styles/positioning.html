<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE Challenge - CSS Positioning Activity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="icon">
                <img src="../images/icon.JPG" alt="icon pic" class="avatar">
                <span class="username"> seina nakashima</span>
            </div>
            <div class="header-right">
                <span class="time">15 mins</span>
                <i class="material-icons menu-icon">more_vert</i>
            </div>
        </div>
        <div class="card-image">
            <img src="../images/moon.jpg" alt="Moon">
        </div>
        <div   class="card-footer">
            <div class="left-icons">
                <i class="material-icons">bookmark_border</i>
                <i class="material-icons">share</i>
            </div>
            <div class="right-icons">
                <span class="comments">
                    <i class="material-icons">chat_bubble_outline</i> 125
                </span>
                <span class="likes">
                    852 <i class="material-icons">favorite_border</i>
                </span>
            </div>
        </div>
    </div>
    <i class="fas fa-clock" > </i>

</body>
</html>

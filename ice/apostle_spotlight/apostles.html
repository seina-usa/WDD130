<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Presidency & Quorum of the Twelve Apostles</title>
    <style>
       
        body {
            background: #E8ECED;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            position: relative; 
            border-radius: 30px;
            text-align: center;
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            border: 4px solid #000000;
            background-color: #0b2545;
        }

        .bg-christ {
            width: 100%;
            height: auto;
            display: block;
        }

        .text-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card h1 {
            color: #FFFFFF;
            font-size: 1.8rem;
            margin: 0 0 0 0;
        }

        .images-presidency {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px; 
        }

        .images-presidency img {
            border-radius: 50%;
            border: 4px solid #FFFFFF;
            object-fit: cover;
            width: 85px;
            height: 85px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            color: #FFFFFF;
            font-size: 1.2rem;
            font-weight: normal;
            margin: 0 0 15px 0;
        }

        .images-quorum {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px 15px;
            justify-items: center;
            width: 100%;
            max-width: 550px;
        }

        .images-quorum img {
            border-radius: 50%;
            border: 4px solid #FFFFFF;
            object-fit: cover;
            width: 75px;
            height: 75px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

     <main class="card">
    
        <img src="images/christus.webp" alt="Christ" class="bg-christ">

        <div class="text-overlay">
            
            <h1>First Presidency</h1>

            <div class="images-presidency">
                <img src="images/eyring.webp" alt="Eyring">
                <img src="images/oaks.webp" alt="Oaks">
                <img src="images/christofferson.webp" alt="Christofferson">
            </div>

            <h2>Quorum of the Twelve Apostles</h2>

            <!-- 4. 12人の写真（4人×3行） -->
            <div class="images-quorum">
                <img src="images/uchtdorf.webp" alt="Uchtdorf">
                <img src="images/bednar.webp" alt="Bednar">
                <img src="images/cook.webp" alt="Cook">
                <img src="images/anderson.webp" alt="Anderson">
                <img src="images/rasband.webp" alt="Rasband">
                <img src="images/stevenson.webp" alt="Stevenson">
                <img src="images/renlund.webp" alt="Renlund">
                <img src="images/gong.webp" alt="Gong">
                <img src="images/soares.webp" alt="Soares">
                <img src="images/kearon.webp" alt="Kearon">
                <img src="images/causse.webp" alt="Causse">
                <img src="images/gilbert.webp" alt="Gilbert"> 
            </div>

        </div>
     </main>

</body>
</html>
